# Put an HTTPS reverse proxy in front of this API on a persistent Docker server.
services:
  backend:
    build: .
    restart: unless-stopped
    environment:
      SECRET_KEY: ${SECRET_KEY:?Set a stable random SECRET_KEY in the server .env}
      ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: 60
      DATABASE_URL: sqlite:////data/drive.db
      CORS_ORIGINS: ${CORS_ORIGINS:?Set the exact HTTPS frontend origin}
      MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-90}
    ports:
      - "127.0.0.1:8001:8001"
    volumes:
      - drive-data:/data
volumes:
  drive-data:
