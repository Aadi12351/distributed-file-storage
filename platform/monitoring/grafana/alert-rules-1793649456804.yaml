apiVersion: 1
groups:
    - orgId: 1
      name: "\tdrive-server, interval 1m"
      folder: Drive Alerts
      interval: 1m
      rules:
        - uid: eg345tven89a8d
          title: Drive Server High RAM
          condition: C
          data:
            - refId: A
              relativeTimeRange:
                from: 600
                to: 0
              datasourceUid: prometheus
              model:
                editorMode: code
                exemplar: false
                expr: "100 * (\r\n  1 -\r\n  node_memory_MemAvailable_bytes{job=\"drive-server\"}\r\n  /\r\n  node_memory_MemTotal_bytes{job=\"drive-server\"}\r\n)"
                instant: true
                interval: ""
                intervalMs: 1000
                legendFormat: __auto
                maxDataPoints: 43200
                range: false
                refId: A
            - refId: C
              queryType: expression
              datasourceUid: __expr__
              model:
                conditions:
                    - evaluator:
                        params:
                            - 85
                        type: gt
                      operator:
                        type: and
                      query:
                        params:
                            - C
                      reducer:
                        params: []
                        type: last
                      type: query
                datasource:
                    type: __expr__
                    uid: __expr__
                expression: A
                intervalMs: 1000
                maxDataPoints: 43200
                refId: C
                type: threshold
          noDataState: NoData
          execErrState: Error
          for: 5m
          isPaused: false
          notification_settings:
            receiver: Aaditya
