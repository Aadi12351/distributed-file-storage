services:
  prometheus:
    image: quay.io/prometheus/prometheus:v3.15.1-distroless
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=24h
      - --storage.tsdb.retention.size=2GB
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    mem_limit: 1g
    logging:
      driver: local

  grafana:
    image: grafana/grafana:13.3.0-distroless
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?Password required}
      GF_USERS_ALLOW_SIGN_UP: "false"


      GF_SMTP_ENABLED: "true"
      GF_SMTP_HOST: "smtp.gmail.com:587"
      GF_SMTP_USER: "${GRAFANA_SMTP_USER:?Gmail address required}"
      GF_SMTP_PASSWORD: "${GRAFANA_SMTP_PASSWORD:?Google app password required}"
      GF_SMTP_FROM_ADDRESS: "${GRAFANA_SMTP_USER}"
      GF_SMTP_FROM_NAME: "Drive Monitoring"
      GF_SMTP_STARTTLS_POLICY: "MandatoryStartTLS"
    ports:
      - "3000:3000"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
    mem_limit: 512m
    logging:
      driver: local

volumes:
  prometheus-data:
  grafana-data:
