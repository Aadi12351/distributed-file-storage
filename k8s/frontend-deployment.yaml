apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: drive
spec:
  replicas: 1
  selector:
    matchLabels:
      app: drive-frontend
  template:
    metadata:
      labels:
        app: drive-frontend
    spec:
      containers:
        - name: frontend
          image: drive-frontend:1e14495d5609-6
          imagePullPolicy: Never
          ports:
            - containerPort: 80
          resources:
            requests:
              cpu: 50m
              memory: 32Mi
            limits:
              cpu: 500m
              memory: 128Mi
          readinessProbe:
            httpGet:
              path: /
              port: 80
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 10
